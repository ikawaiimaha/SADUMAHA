<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SADU — System for Arts Data Unification | سدو</title>
    <meta name="description" content="Bilingual cultural programme operating system and institutional record connecting leadership, curation, committee evaluation, scope, contracts, specialist operations, and accountable closure." />
    <meta property="og:title" content="SADU — System for Arts Data Unification | سدو" />
    <meta property="og:description" content="Bilingual cultural programme operating system and institutional record connecting leadership, curation, committee evaluation, scope, contracts, specialist operations, and accountable closure." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <style>
      #sadu-fallback { box-sizing:border-box; min-height:100svh; padding:2rem; display:grid; place-content:center; text-align:center; background:#f7f1e6; color:#211b17; font:1rem/1.7 system-ui,sans-serif; }
      #sadu-fallback[hidden] { display:none; }
      #sadu-fallback button { margin:1rem auto; padding:.75rem 1.5rem; font:inherit; color:white; background:#652f3c; border:0; border-radius:4px; cursor:pointer; }
      #sadu-fallback button:focus-visible { outline:3px solid #2f6178; outline-offset:4px; }
    </style>
  </head>
  <body class="bg-[#F7F1E6] text-[#211B17] font-sans antialiased selection:bg-[#8B3A1F] selection:text-white">
    <section id="sadu-fallback" aria-label="SADU loading / تحميل سدو">
      <h1>SADU · <span lang="ar" dir="rtl">سدو</span></h1>
      <div role="status" id="sadu-load-message">
        <p>Loading the SADU demonstration…</p>
        <p lang="ar" dir="rtl">جارٍ تحميل العرض التجريبي لسدو…</p>
      </div>
      <button type="button" onclick="window.location.reload()">Retry · <span lang="ar" dir="rtl">إعادة المحاولة</span></button>
      <noscript><p>Enable JavaScript to use SADU.</p><p lang="ar" dir="rtl">فعّل JavaScript لاستخدام سدو.</p></noscript>
    </section>
    <div id="root"></div>
    <script>
      (() => {
        const fallback = document.getElementById('sadu-fallback');
        const message = document.getElementById('sadu-load-message');
        const showRetry = () => {
          if (fallback.hidden) return;
          message.innerHTML = '<p>SADU has not loaded. Check your connection and retry.</p><p lang="ar" dir="rtl">لم يكتمل تحميل سدو. تحقق من الاتصال ثم أعد المحاولة.</p>';
        };
        const timer = setTimeout(showRetry, 8000);
        window.addEventListener('sadu:ready', () => { clearTimeout(timer); fallback.hidden = true; }, { once: true });
        window.addEventListener('error', event => {
          if (event.target instanceof HTMLScriptElement && event.target.type === 'module') showRetry();
        }, true);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
