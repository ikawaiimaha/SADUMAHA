<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>السدو | SADU</title>
    <meta name="description" content="SADU, named after Al Sadu weaving: Source, Assemble, Decide, Understand. Artist nominations across the Sharjah Department of Culture's events, from scouting to the Committee's decision. First pilot: Sharjah Islamic Arts Festival, December 2027." />
    <meta property="og:title" content="السدو | SADU" />
    <meta property="og:description" content="Artist nominations across the Sharjah Department of Culture's events, from scouting to the Committee's decision. First pilot: Sharjah Islamic Arts Festival, December 2027." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Fraunces:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <style>
      #sadu-fallback { box-sizing:border-box; min-height:100svh; padding:2rem; display:grid; place-content:center; text-align:center; background:#f7f1e6; color:#111817; font:1rem/1.7 system-ui,sans-serif; }
      #sadu-fallback[hidden] { display:none; }
      #sadu-fallback button { margin:1rem auto; padding:.75rem 1.5rem; font:inherit; color:white; background:#652f3c; border:0; border-radius:4px; cursor:pointer; }
      #sadu-fallback button:focus-visible { outline:3px solid #2f6178; outline-offset:4px; }
    </style>
  </head>
  <body class="bg-[#F7F1E6] text-[#111817] font-sans antialiased selection:bg-[#8B3A1F] selection:text-white">
    <section id="sadu-fallback" aria-label="تحميل السدو">
      <h1>سدو · <span lang="en" dir="ltr">SADU</span></h1>
      <div role="status" id="sadu-load-message">
        <p>جارٍ تحميل العرض التجريبي للسدو…</p>
        <p lang="en" dir="ltr">Loading the SADU demonstration…</p>
      </div>
      <button type="button" onclick="window.location.reload()">إعادة المحاولة · <span lang="en" dir="ltr">Retry</span></button>
      <noscript><p>فعّل JavaScript لاستخدام السدو.</p><p lang="en" dir="ltr">Enable JavaScript to use SADU.</p></noscript>
    </section>
    <div id="root"></div>
    <script>
      (() => {
        const fallback = document.getElementById('sadu-fallback');
        const message = document.getElementById('sadu-load-message');
        const showRetry = () => {
          if (fallback.hidden) return;
          message.innerHTML = '<p>لم يكتمل تحميل السدو. تحقق من الاتصال ثم أعد المحاولة.</p><p lang="en" dir="ltr">SADU has not loaded. Check your connection and retry.</p>';
        };
        const timer = setTimeout(showRetry, 8000);
        window.addEventListener('sadu:ready', () => { clearTimeout(timer); fallback.hidden = true; }, { once: true });
        window.addEventListener('error', event => {
          if (event.target instanceof HTMLScriptElement && event.target.type === 'module') showRetry();
        }, true);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
